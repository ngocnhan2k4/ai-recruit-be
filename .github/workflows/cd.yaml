name: CD Pipeline
env:
  APP_URL: https://airecruit.software
on:
  push:
    branches: ["dev", "main"]

jobs:
  cd:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      
      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/dev'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        if: github.ref == 'refs/heads/dev'
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/ai-recruit:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/ai-recruit:latest

      - name: Copy docker-compose to server
        if: github.ref == 'refs/heads/dev'
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          port: ${{ secrets.DEV_SERVER_SSH_PORT }}
          source: "./docker-compose-dev.yaml"
          target: "/var/www/my-app/"
    
      - name: Deploy to Development Server
        if: github.ref == 'refs/heads/dev'
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          port: ${{ secrets.DEV_SERVER_SSH_PORT }}
          script: |
            cd /var/www/my-app
            docker-compose -f docker-compose-dev.yaml down
            docker rmi -f $(docker images -aq)
            docker-compose -f docker-compose-dev.yaml up -d

      - name: Health Check After Deployment
        id: healthcheck
        if: github.ref == 'refs/heads/dev'
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          port: ${{ secrets.DEV_SERVER_SSH_PORT }}
          script: |
            echo "🔍 Waiting for application to start..."
            sleep 120

            echo "🏥 Running health check at $APP_URL..."

            # Check if container is running
            if ! docker-compose -f /var/www/my-app/docker-compose-dev.yaml ps | grep "Up"; then
              echo "❌ Container is not running"
              docker-compose -f /var/www/my-app/docker-compose-dev.yaml logs backend
              exit 1
            fi
            
            # Health check with retries
            MAX_RETRIES=5
            RETRY_COUNT=0
            
            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              echo "🔄 Health check attempt $((RETRY_COUNT + 1))/$MAX_RETRIES"
              
              # Test simple health endpoint
              if curl -f -s $APP_URL/api/v1/health > /dev/null 2>&1; then
                echo "✅ Health check passed!"
                
                # Get health check response
                HEALTH_RESPONSE=$(curl -s $APP_URL/api/v1/health)
                echo "📊 Health Status: $HEALTH_RESPONSE"
            
                exit 0
              else
                echo "❌ Health check failed (attempt $((RETRY_COUNT + 1)))"
                RETRY_COUNT=$((RETRY_COUNT + 1))
                
                if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                  echo "⏳ Waiting 15 seconds before retry..."
                  sleep 15
                fi
              fi
            done
            
            echo "❌ Health check failed after $MAX_RETRIES attempts"
            echo "📋 Container logs:"
            docker-compose -f /var/www/my-app/docker-compose-dev.yaml logs --tail=20 backend
            echo "🔍 Container status:"
            docker-compose -f /var/www/my-app/docker-compose-dev.yaml ps
            exit 1

      - name: Notify Slack on Success
        if: success()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: cicd
          SLACK_COLOR: good
          SLACK_TITLE: "✅ CD Pipeline Success"
          SLACK_MESSAGE: |
            *Repository:* ${{ github.repository }}
            *Branch:* ${{ github.ref_name }}
            *Commit:* ${{ github.event.head_commit.message }}
            *Author:* ${{ github.event.head_commit.author.name }}
            *Status:* Deployed ✅
              • Link Swagger: ${APP_URL}/docs
            
            **Checks Completed:**
            • Docker: ✅ Built & Pushed
            • Deploy: ✅ Successful
            • Health Check: ✅ Passed
            
      

      - name: Notify Slack on Failure
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: cicd
          SLACK_COLOR: danger
          SLACK_TITLE: "❌ CD Pipeline Failed"
          SLACK_MESSAGE: |
            *Repository:* ${{ github.repository }}
            *Branch:* ${{ github.ref_name }}
            *Commit:* ${{ github.event.head_commit.message }}
            *Author:* ${{ github.event.head_commit.author.name }}
            *Status:* Pipeline failed ❌
            
            Please fix the issues and push again.