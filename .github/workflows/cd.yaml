      #       exit 1

      - name: Notify Slack on Prod Success
        if: success()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: cicd
          SLACK_COLOR: good
          SLACK_TITLE: "🚀 PRODUCTION Deployment Success"
          SLACK_MESSAGE: |
            *Environment:* 🔴 Production
            *Repository:* ${{ github.repository }}
            *Branch:* ${{ github.ref_name }}
            *Commit:* ${{ github.event.head_commit.message }}
            *Author:* ${{ github.event.head_commit.author.name }}
            *Status:* Deployed ✅
            *Prod URL:* ${{ env.APP_URL }}

            **Checks Completed:**
            • Docker: ✅ Built & Pushed
            • Deploy: ✅ Successful
            • Health Check: ✅ Passed

      - name: Notify Slack on Prod Failure
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: cicd
          SLACK_COLOR: danger
          SLACK_TITLE: "🚨 PRODUCTION Deployment Failed"
          SLACK_MESSAGE: |
            *Environment:* 🔴 Production
            *Repository:* ${{ github.repository }}
            *Branch:* ${{ github.ref_name }}
            *Status:* Pipeline failed ❌

            Please fix the issues and push again.
