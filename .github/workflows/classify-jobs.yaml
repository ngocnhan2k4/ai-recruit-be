name: Classify Uncategorized Jobs

on:
  schedule:
    # Run every day at 7PM at UTC+7
    - cron: "0 19 * * *"
  workflow_dispatch:

jobs:
  classify-jobs:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: crawl_jobs/job_index_queue/package-lock.json

      - name: Run Job Classification
        working-directory: ./crawl_jobs
        env:
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: |
          python scripts/run_classify_jobs.py

      - name: Notify Slack
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.CRAWL_CHANNEL }}
          SLACK_CHANNEL: crawl
          SLACK_COLOR: ${{ job.status == 'success' && 'good' || 'danger' }}
          SLACK_TITLE: "🏷️ Job Classification Results (Dev & Prod)"
          SLACK_MESSAGE: |
            📊 Dev jobs processed: ${{ env.DEV_JOB_COUNT || '0' }}
            📊 Prod jobs processed: ${{ env.PROD_JOB_COUNT || '0' }}
            ✅ Status: ${{ job.status }}
