name: Classify Uncategorized Jobs

on:
  schedule:
    # Run twice a week: Monday and Thursday at 2:00 AM UTC
    - cron: "0 2 * * 1,4"
  workflow_dispatch:

jobs:
  classify-jobs:
    strategy:
      matrix:
        env: [dev, prod]
      max-parallel: 1

    environment: ${{ matrix.env }}
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        working-directory: ./crawl_jobs
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary pandas transformers torch --no-cache-dir

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: crawl_jobs/job_index_queue/package-lock.json

      - name: Install queue bridge dependencies
        working-directory: ./crawl_jobs
        env:
          QUEUE_REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          if [ -n "$QUEUE_REDIS_URL" ]; then
            npm ci --omit=dev --prefix ./job_index_queue
          else
            echo "Skip queue bridge install: REDIS_URL secret is empty."
          fi

      - name: Validate Redis credentials
        working-directory: ./crawl_jobs
        env:
          QUEUE_REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          if [ -z "$QUEUE_REDIS_URL" ]; then
            echo "QUEUE_REDIS_URL_EFFECTIVE=" >> "$GITHUB_ENV"
            echo "Skip Redis validation: REDIS_URL secret is empty."
            exit 0
          fi

          echo "QUEUE_REDIS_URL_EFFECTIVE=$QUEUE_REDIS_URL" >> "$GITHUB_ENV"

          node <<'NODE'
          const path = require("path");
          const Redis = require(
            path.resolve(process.cwd(), "job_index_queue", "node_modules", "ioredis")
          );

          const url = process.env.QUEUE_REDIS_URL;
          const client = new Redis(url, {
            enableReadyCheck: true,
            connectTimeout: 5000,
            maxRetriesPerRequest: 1,
            retryStrategy: () => null,
          });

          const timer = setTimeout(() => {
            console.error("Redis connection timeout");
            process.exit(1);
          }, 6000);

          client.once("ready", async () => {
            clearTimeout(timer);
            await client.quit();
            process.exit(0);
          });

          client.once("error", (err) => {
            console.error(err?.message || err);
            process.exit(1);
          });
          NODE

          if [ $? -ne 0 ]; then
            echo "Queue disabled: Redis auth/connect failed."
            echo "QUEUE_REDIS_URL_EFFECTIVE=" >> "$GITHUB_ENV"
          fi

      - name: Export uncategorized jobs to CSV
        working-directory: ./crawl_jobs
        run: |
          python scripts/export_uncategorized_jobs.py \
            --db_url "${{ secrets.DATABASE_URL }}" \
            --output_file "classifier/data/predict_jobs.csv"

      - name: Check if there are jobs to classify
        id: check_jobs
        working-directory: ./crawl_jobs
        run: |
          JOB_COUNT=$(python -c "import pandas as pd; print(len(pd.read_csv('classifier/data/predict_jobs.csv')))")
          echo "job_count=$JOB_COUNT" >> $GITHUB_OUTPUT

          if [ "$JOB_COUNT" -le 0 ]; then
            echo "📭 No uncategorized jobs found. Skipping classification."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "📋 Found $JOB_COUNT jobs to classify"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Run job classifier
        if: steps.check_jobs.outputs.skip != 'true'
        working-directory: ./crawl_jobs
        run: |
          python classifier/predict.py \
            --model "tienminhktvn/job-category-classifier" \
            --input_file "classifier/data/predict_jobs.csv" \
            --output_file "classifier/data/results.csv"

      - name: Update job categories in database
        if: steps.check_jobs.outputs.skip != 'true'
        working-directory: ./crawl_jobs
        run: |
          python scripts/update_category.py \
            --db_url "${{ secrets.DATABASE_URL }}" \
            --csv_file "classifier/data/results.csv" \
            --redis_url "${{ env.QUEUE_REDIS_URL_EFFECTIVE }}"

      - name: Delete jobs with 'Other' category
        if: steps.check_jobs.outputs.skip != 'true'
        working-directory: ./crawl_jobs
        run: |
          python scripts/delete_other_category_jobs.py \
            --db_url "${{ secrets.DATABASE_URL }}" \
            --redis_url "${{ env.QUEUE_REDIS_URL_EFFECTIVE }}"

      - name: Delete unused categories
        working-directory: ./crawl_jobs
        run: |
          python scripts/cleanup_unused_categories.py \
            --db_url "${{ secrets.DATABASE_URL }}"

      - name: Notify Slack
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.CRAWL_CHANNEL }}
          SLACK_CHANNEL: crawl
          SLACK_COLOR: ${{ job.status == 'success' && 'good' || 'danger' }}
          SLACK_TITLE: "🏷️ Job Classification Results (${{ matrix.env }})"
          SLACK_MESSAGE: |
            📊 Jobs processed: ${{ steps.check_jobs.outputs.job_count || '0' }}
            ✅ Status: ${{ job.status }}
