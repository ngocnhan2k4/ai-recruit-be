name: Classify Uncategorized Jobs

on:
  schedule:
    # Run every day at 7PM at UTC+7
    - cron: "0 19 * * *"
  workflow_dispatch:

jobs:
  classify-jobs:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: crawl_jobs/job_index_queue/package-lock.json

      - name: Fetch secrets and Install queue dependencies
        working-directory: ./crawl_jobs
        env:
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: |
          VAULT_RESP_DEV=$(curl -s -H "X-Vault-Token: $VAULT_TOKEN" https://vault.airecruit.software/v1/airecruit-backend/data/dev)
          VAULT_RESP_PROD=$(curl -s -H "X-Vault-Token: $VAULT_TOKEN" https://vault.airecruit.software/v1/airecruit-backend/data/prod)
          export VAULT_RESP_DEV VAULT_RESP_PROD

          HAS_REDIS=$(python -c "import json, os; d_dev = json.loads(os.environ['VAULT_RESP_DEV']).get('data', {}).get('data', {}) or json.loads(os.environ['VAULT_RESP_DEV']).get('data', {}); d_prod = json.loads(os.environ['VAULT_RESP_PROD']).get('data', {}).get('data', {}) or json.loads(os.environ['VAULT_RESP_PROD']).get('data', {}); print('yes' if d_dev.get('REDIS_HOST') or d_prod.get('REDIS_HOST') else 'no')")

          if [ "$HAS_REDIS" = "yes" ]; then
            npm ci --omit=dev --prefix ./job_index_queue
          else
            echo "Skip queue bridge install: No Redis hosts configured."
          fi

      - name: Install dependencies
        working-directory: ./crawl_jobs
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary pandas transformers torch --no-cache-dir

      - name: Run Job Classification Loop
        working-directory: ./crawl_jobs
        env:
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: |
          for env_name in dev prod; do
            echo "=========================================="
            echo "🚀 Processing classification for environment: $env_name"
            echo "=========================================="
            
            # Fetch secrets from Vault
            VAULT_RESP=$(curl -s -H "X-Vault-Token: $VAULT_TOKEN" https://vault.airecruit.software/v1/airecruit-backend/data/$env_name)
            export VAULT_RESP
            
            # Extract variables using Python helper
            read -r DATABASE_URL REDIS_HOST REDIS_PORT REDIS_PASSWORD REDIS_DB <<< $(python -c "import json, os; resp = json.loads(os.environ['VAULT_RESP']); data = resp.get('data', {}).get('data', {}) or resp.get('data', {}); print(f\"{data.get('DATABASE_URL','')} {data.get('REDIS_HOST','')} {data.get('REDIS_PORT','6379')} {data.get('REDIS_PASSWORD','')} {data.get('REDIS_DB','0')}\")")
            
            # Construct and validate Redis url
            if [ -n "$REDIS_HOST" ]; then
              export REDIS_PASSWORD
              ENCODED_PASS=$(python -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['REDIS_PASSWORD']))")
              if [ -n "$ENCODED_PASS" ]; then
                QUEUE_REDIS_URL="redis://:$ENCODED_PASS@$REDIS_HOST:$REDIS_PORT/$REDIS_DB"
              else
                QUEUE_REDIS_URL="redis://$REDIS_HOST:$REDIS_PORT/$REDIS_DB"
              fi
              
              # Validate Redis Connection
              export QUEUE_REDIS_URL
              node -e '
              const path = require("path");
              const Redis = require(path.resolve(process.cwd(), "job_index_queue", "node_modules", "ioredis"));
              const client = new Redis(process.env.QUEUE_REDIS_URL, {
                enableReadyCheck: true,
                connectTimeout: 5000,
                maxRetriesPerRequest: 1,
                retryStrategy: () => null,
              });
              const timer = setTimeout(() => {
                console.error("Redis connection timeout");
                process.exit(1);
              }, 6000);
              client.once("ready", async () => {
                clearTimeout(timer);
                await client.quit();
                process.exit(0);
              });
              client.once("error", (err) => {
                console.error(err?.message || err);
                process.exit(1);
              });
              '
              if [ $? -eq 0 ]; then
                QUEUE_REDIS_URL_EFFECTIVE="$QUEUE_REDIS_URL"
              else
                echo "⚠️ Queue disabled: Redis auth/connect failed for $env_name."
                QUEUE_REDIS_URL_EFFECTIVE=""
              fi
            else
              QUEUE_REDIS_URL_EFFECTIVE=""
            fi
            
            # Export uncategorized jobs to CSV
            CSV_PATH="classifier/data/predict_jobs_${env_name}.csv"
            python scripts/export_uncategorized_jobs.py \
              --db_url "$DATABASE_URL" \
              --output-file "$CSV_PATH"
              
            # Check job count
            JOB_COUNT=$(python -c "import pandas as pd; print(len(pd.read_csv('$CSV_PATH')))" 2>/dev/null || echo 0)
            
            # Export count to GITHUB_ENV for Slack Notification
            UPPER_ENV=$(echo "$env_name" | tr '[:lower:]' '[:upper:]')
            echo "${UPPER_ENV}_JOB_COUNT=$JOB_COUNT" >> "$GITHUB_ENV"
            
            if [ "$JOB_COUNT" -gt 0 ]; then
              # Run classifier
              RESULTS_PATH="classifier/data/results_${env_name}.csv"
              python classifier/predict.py \
                --model "tienminhktvn/job-category-classifier" \
                --input_file "$CSV_PATH" \
                --output_file "$RESULTS_PATH"
                
              # Update database
              python scripts/update_category.py \
                --db_url "$DATABASE_URL" \
                --csv_file "$RESULTS_PATH" \
                --redis_url "$QUEUE_REDIS_URL_EFFECTIVE"
                
              # Delete "Other" category jobs
              python scripts/delete_other_category_jobs.py \
                --db_url "$DATABASE_URL" \
                --redis_url "$QUEUE_REDIS_URL_EFFECTIVE"
            else
              echo "📭 No uncategorized jobs found for $env_name. Skipping classification."
            fi
            
            # Cleanup unused categories
            python scripts/cleanup_unused_categories.py \
              --db_url "$DATABASE_URL"
          done

      - name: Notify Slack
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.CRAWL_CHANNEL }}
          SLACK_CHANNEL: crawl
          SLACK_COLOR: ${{ job.status == 'success' && 'good' || 'danger' }}
          SLACK_TITLE: "🏷️ Job Classification Results (Dev & Prod)"
          SLACK_MESSAGE: |
            📊 Dev jobs processed: ${{ env.DEV_JOB_COUNT || '0' }}
            📊 Prod jobs processed: ${{ env.PROD_JOB_COUNT || '0' }}
            ✅ Status: ${{ job.status }}
