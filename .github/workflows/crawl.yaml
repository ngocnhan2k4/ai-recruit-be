                          k, v = line.strip().split('=', 1)
                          try: d[k] = int(v)
                          except: d[k] = v
              return d

          v1 = load_vars('gha_out_1.txt')
          v2 = load_vars('gha_out_2.txt')
          keys = set(v1.keys()) | set(v2.keys())
