name: Crawl Jobs

on:
  schedule:
    - cron: "30 10 * * *"
  workflow_dispatch:

jobs:
  run-crawler:
    strategy:
      matrix:
        env: [dev, prod]

    environment: ${{ matrix.env }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select LinkedIn keyword
        id: keyword
        run: |
          FILE="crawl_jobs/classifier/data/categories.txt"

          if [ ! -f "$FILE" ]; then
            echo "Categories file not found: $FILE"
            exit 1
          fi

          mapfile -t KEYWORDS < <(grep . "$FILE")

          COUNT=${#KEYWORDS[@]}
          if [ "$COUNT" -eq 0 ]; then
            echo "No keywords found in $FILE"
            exit 1
          fi

          DAY_INDEX=$(date +%j)
          IDX=$(( DAY_INDEX % COUNT ))

          SELECTED="${KEYWORDS[$IDX]}"

          echo "keyword=$SELECTED" >> $GITHUB_OUTPUT
          echo "Selected LinkedIn keyword: $SELECTED"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        working-directory: ./crawl_jobs
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run crawler
        id: run_crawler
        working-directory: ./crawl_jobs
        run: |
          python main.py \
            --db-url "${{ secrets.DATABASE_URL }}" \
            --gha-output "$GITHUB_OUTPUT" \
            --pages 1 \
            --linkedin-keywords "${{ steps.keyword.outputs.keyword }}"

      - name: Notify Slack
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.CRAWL_CHANNEL }}
          SLACK_CHANNEL: crawl
          SLACK_COLOR: ${{ job.status == 'success' && 'good' || 'danger' }}
          SLACK_TITLE: "📊 Kết quả crawl việc làm (${{ matrix.env }})"
          SLACK_MESSAGE: |
            🕒 Thời gian: ${{ steps.run_crawler.outputs.crawl_time }}

            🔹 ITviec: ${{ steps.run_crawler.outputs.itviec }} jobs
            🔹 TopCV: ${{ steps.run_crawler.outputs.topcv }} jobs
            🔹 JobsGo: ${{ steps.run_crawler.outputs.jobsgo }} jobs
            🔹 Linkedin: ${{ steps.run_crawler.outputs.linkedin }} jobs
            🔹 VietnameWorks: ${{ steps.run_crawler.outputs.vietnamworks }} jobs

            ✅ Status: ${{ job.status }}
