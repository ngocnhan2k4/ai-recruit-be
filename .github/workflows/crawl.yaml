          SLACK_WEBHOOK: ${{ secrets.CRAWL_CHANNEL }}
          SLACK_CHANNEL: crawl
          SLACK_COLOR: ${{ job.status == 'success' && 'good' || 'danger' }}
          SLACK_TITLE: "📊 Kết quả crawl việc làm SELFHOSTED (Dev & Prod) - Mode: ${{ inputs.mode || 'update' }}"
          SLACK_MESSAGE: |
            🕒 Thời gian: ${{ steps.aggregate_outputs.outputs.crawl_time }}

            📈 Tổng hợp:
            ✓ Inserted: ${{ steps.aggregate_outputs.outputs.total_inserted }} jobs
            ↻ Updated: ${{ steps.aggregate_outputs.outputs.total_updated }} jobs

            🔹 TopCV: ${{ steps.aggregate_outputs.outputs.topcv }} jobs (${{ inputs.topcv_pages || '1' }} pages)
            🔹 JobsGo: ${{ steps.aggregate_outputs.outputs.jobsgo }} jobs (${{ inputs.jobsgo_pages || '1' }} pages)
            🔹 LinkedIn (Self-hosted): ${{ steps.aggregate_outputs.outputs.linkedin }} jobs (10 jobs / 2 categories)

            ✅ Status: ${{ job.status }}

  extract-skills:
    needs: [run-crawler-ubuntu, run-crawler-selfhosted]
    if: |
      always() &&
      (needs.run-crawler-ubuntu.result == 'success' || needs.run-crawler-selfhosted.result == 'success') &&
      (needs.run-crawler-ubuntu.outputs.total_inserted != '0' || needs.run-crawler-ubuntu.outputs.total_updated != '0' || 
       needs.run-crawler-selfhosted.outputs.total_inserted != '0' || needs.run-crawler-selfhosted.outputs.total_updated != '0')
    strategy:
      matrix:
        env: [dev, prod]
    environment: ${{ matrix.env }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: ./crawl_jobs
        run: |
          python -m pip install --upgrade pip

          pip install \
            psycopg2-binary \
            pandas \
            transformers \
            torch \
            bs4 \
            tqdm \
            --no-cache-dir

      - name: Export unextracted jobs
        id: export_jobs
        working-directory: ./crawl_jobs
        shell: bash
        run: |
          mkdir -p extract_skills/data

          python scripts/export_recent_jobs_for_extraction.py \
            --db-urls "${{ secrets.DEV_DATABASE_URL }}" "${{ secrets.PROD_DATABASE_URL }}" \
            --output-file "extract_skills/data/jobs_export.csv" \
            --hours 24

          JOB_COUNT=$(python -c "import pandas as pd; print(len(pd.read_csv('extract_skills/data/jobs_export.csv')))" 2>/dev/null || echo 0)
          echo "job_count=$JOB_COUNT" >> $GITHUB_OUTPUT

      - name: Extract skills using huggingface model
        if: steps.export_jobs.outputs.job_count != '0'
        working-directory: ./crawl_jobs
        run: |
          python extract_skills/extract_skills.py \
            --db-urls "${{ secrets.DEV_DATABASE_URL }}" "${{ secrets.PROD_DATABASE_URL }}" \
            --model-path "tienminhktvn/extract-skills-model" \
            --input-file "extract_skills/data/jobs_export.csv"

      - name: Cleanup HuggingFace cache
        if: always()
        run: |
          rm -rf ~/.cache/huggingface || true
          rm -rf ~/.cache/pip || true

      - name: Notify Slack
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.CRAWL_CHANNEL }}
          SLACK_CHANNEL: crawl
          SLACK_COLOR: ${{ job.status == 'success' && 'good' || 'danger' }}
          SLACK_TITLE: "🧠 Skill Extraction Results (Dev & Prod)"
          SLACK_MESSAGE: |
            📊 Jobs processed: ${{ steps.export_jobs.outputs.job_count || '0' }}
            ✅ Status: ${{ job.status }}
