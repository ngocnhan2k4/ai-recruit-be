name: Classify Uncategorized Jobs

on:
  schedule:
    # Run twice a week: Monday and Thursday at 2:00 AM UTC
    - cron: "0 2 * * 1,4"
  workflow_dispatch:

jobs:
  classify-jobs:
    strategy:
      matrix:
        env: [dev, prod]
      max-parallel: 1

    environment: ${{ matrix.env }}
    runs-on: arc-runner-set

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        working-directory: ./crawl_jobs
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary pandas transformers torch --no-cache-dir

      - name: Export uncategorized jobs to CSV
        working-directory: ./crawl_jobs
        run: |
          python scripts/export_uncategorized_jobs.py \
            --db_url "${{ secrets.DATABASE_URL }}" \
            --output_file "classifier/data/predict_jobs.csv"

      - name: Check if there are jobs to classify
        id: check_jobs
        working-directory: ./crawl_jobs
        run: |
          LINES=$(wc -l < classifier/data/predict_jobs.csv)
          # Subtract 1 for header
          JOB_COUNT=$((LINES - 1))
          echo "job_count=$JOB_COUNT" >> $GITHUB_OUTPUT

          if [ "$JOB_COUNT" -le 0 ]; then
            echo "📭 No uncategorized jobs found. Skipping classification."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "📋 Found $JOB_COUNT jobs to classify"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Run job classifier
        if: steps.check_jobs.outputs.skip != 'true'
        working-directory: ./crawl_jobs
        run: |
          QUEUE_ARGS=()
          QUEUE_MODE="disabled"

          if [ -n "$QUEUE_REDIS_URL" ]; then
            QUEUE_MODE="enabled"
            QUEUE_ARGS+=(
              --queue-index-enabled
              --queue-redis-url "$QUEUE_REDIS_URL"
            )
          else
            echo "Queue indexing disabled: REDIS_URL secret is empty."
          fi

          echo "queue_mode=$QUEUE_MODE" >> "$GITHUB_OUTPUT"

          python -u main.py \
            --db-url "${{ secrets.DATABASE_URL }}" \
            --gha-output "$GITHUB_OUTPUT" \
            --mode ${{ inputs.mode || 'update' }} \
            --itviec-pages ${{ inputs.itviec_pages || '1' }} \
            --linkedin-pages ${{ inputs.linkedin_pages || '1' }} \
            --topcv-pages ${{ inputs.topcv_pages || '1' }} \
            --jobsgo-pages ${{ inputs.jobsgo_pages || '1' }} \
            --vietnamworks-pages ${{ inputs.vietnamworks_pages || '1' }} \
            --linkedin-keywords "${{ steps.keyword.outputs.keyword }}" \
            "${QUEUE_ARGS[@]}"

      - name: Notify Slack
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.CRAWL_CHANNEL }}
          SLACK_CHANNEL: crawl
          SLACK_COLOR: ${{ job.status == 'success' && 'good' || 'danger' }}
          SLACK_TITLE: "🏷️ Job Classification Results (${{ matrix.env }})"
          SLACK_MESSAGE: |
            📊 Jobs processed: ${{ steps.check_jobs.outputs.job_count || '0' }}
            ✅ Status: ${{ job.status }}

  extract-skills:
    needs: run-crawler
    strategy:
      matrix:
        env: [dev, prod]
    environment: ${{ matrix.env }}
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        working-directory: ./crawl_jobs
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary pandas transformers torch bs4 tqdm --no-cache-dir

      - name: Export unextracted jobs
        id: export_jobs
        working-directory: ./crawl_jobs
        run: |
          mkdir -p extract_skills/data
          python scripts/export_recent_jobs_for_extraction.py \
            --db-url "${{ secrets.DATABASE_URL }}" \
            --output-file "extract_skills/data/jobs_export.csv" \
            --hours 24

          if [ -f "extract_skills/data/jobs_export.csv" ]; then
            LINES=$(wc -l < extract_skills/data/jobs_export.csv)
            JOB_COUNT=$((LINES - 1))
          else
            JOB_COUNT=0
          fi
          echo "job_count=$JOB_COUNT" >> $GITHUB_OUTPUT

      - name: Extract skills using huggingface model
        working-directory: ./crawl_jobs
        run: |
          python extract_skills/extract_skills.py \
            --db-url "${{ secrets.DATABASE_URL }}" \
            --model-path "tienminhktvn/extract-skills-model" \
            --input-file "extract_skills/data/jobs_export.csv"

      - name: Notify Slack
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.CRAWL_CHANNEL }}
          SLACK_CHANNEL: crawl
          SLACK_COLOR: ${{ job.status == 'success' && 'good' || 'danger' }}
          SLACK_TITLE: "🧠 Kết quả trích xuất kỹ năng chuyên sâu (${{ matrix.env }})"
          SLACK_MESSAGE: |
            📊 Số lượng jobs đã check & xử lý: ${{ steps.export_jobs.outputs.job_count || '0' }}
            ✅ Status: ${{ job.status }}
