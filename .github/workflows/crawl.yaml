name: Crawl Jobs

on:
  schedule:
    - cron: "30 10 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode for existing jobs"
        required: false
        default: "skip"
        type: choice
        options:
          - skip
          - update
      itviec_pages:
        description: "ITViec pages to crawl"
        required: false
        default: "1"
        type: string
      linkedin_pages:
        description: "LinkedIn pages to crawl"
        required: false
        default: "1"
        type: string
      topcv_pages:
        description: "TopCV pages to crawl"
        required: false
        default: "1"
        type: string
      jobsgo_pages:
        description: "JobsGO pages to crawl"
        required: false
        default: "1"
        type: string
      vietnamworks_pages:
        description: "VietnamWorks pages to crawl"
        required: false
        default: "1"
        type: string

jobs:
  run-crawler:
    strategy:
      matrix:
        env: [dev, prod]

    environment: ${{ matrix.env }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select LinkedIn keyword
        id: keyword
        run: |
          FILE="crawl_jobs/classifier/data/categories.txt"

          if [ ! -f "$FILE" ]; then
            echo "Categories file not found: $FILE"
            exit 1
          fi

          mapfile -t KEYWORDS < <(grep . "$FILE")

          COUNT=${#KEYWORDS[@]}
          if [ "$COUNT" -eq 0 ]; then
            echo "No keywords found in $FILE"
            exit 1
          fi

          DAY_INDEX=$(date +%-j)
          IDX=$(( DAY_INDEX % COUNT ))

          SELECTED="${KEYWORDS[$IDX]}"

          echo "keyword=$SELECTED" >> $GITHUB_OUTPUT
          echo "Selected LinkedIn keyword: $SELECTED"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: ./crawl_jobs
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install queue bridge dependencies
        working-directory: ./crawl_jobs
        run: |
          npm install --no-save bullmq

      - name: Run crawler
        id: run_crawler
        working-directory: ./crawl_jobs
        env:
          QUEUE_REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          QUEUE_ARGS=()
          QUEUE_MODE="disabled"

          if [ -n "$QUEUE_REDIS_URL" ]; then
            QUEUE_MODE="enabled"
            QUEUE_ARGS+=(
              --queue-index-enabled
              --queue-redis-url "$QUEUE_REDIS_URL"
            )
          else
            echo "Queue indexing disabled: REDIS_URL secret is empty."
          fi

          echo "queue_mode=$QUEUE_MODE" >> "$GITHUB_OUTPUT"

          python main.py \
            --db-url "${{ secrets.DATABASE_URL }}" \
            --gha-output "$GITHUB_OUTPUT" \
            --mode ${{ inputs.mode || 'update' }} \
            --itviec-pages ${{ inputs.itviec_pages || '1' }} \
            --linkedin-pages ${{ inputs.linkedin_pages || '1' }} \
            --topcv-pages ${{ inputs.topcv_pages || '1' }} \
            --jobsgo-pages ${{ inputs.jobsgo_pages || '1' }} \
            --vietnamworks-pages ${{ inputs.vietnamworks_pages || '1' }} \
            --linkedin-keywords "${{ steps.keyword.outputs.keyword }}" \
            "${QUEUE_ARGS[@]}"

      - name: Notify Slack
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.CRAWL_CHANNEL }}
          SLACK_CHANNEL: crawl
          SLACK_COLOR: ${{ job.status == 'success' && 'good' || 'danger' }}
          SLACK_TITLE: "📊 Kết quả crawl việc làm (${{ matrix.env }}) - Mode: ${{ inputs.mode || 'update' }}"
          SLACK_MESSAGE: |
            🕒 Thời gian: ${{ steps.run_crawler.outputs.crawl_time }}

            📈 Tổng hợp:
            ✓ Inserted: ${{ steps.run_crawler.outputs.total_inserted }} jobs
            ↻ Updated: ${{ steps.run_crawler.outputs.total_updated }} jobs
            📨 Queue Indexed: ${{ steps.run_crawler.outputs.total_queue_enqueued || '0' }} jobs
            ⚠ Queue Failed: ${{ steps.run_crawler.outputs.total_queue_failed || '0' }} jobs
            ⚙ Queue Mode: ${{ steps.run_crawler.outputs.queue_mode }}

            🔹 ITviec: ${{ steps.run_crawler.outputs.itviec }} jobs (${{ inputs.itviec_pages || '1' }} pages)
            🔹 TopCV: ${{ steps.run_crawler.outputs.topcv }} jobs (${{ inputs.topcv_pages || '1' }} pages)
            🔹 JobsGo: ${{ steps.run_crawler.outputs.jobsgo }} jobs (${{ inputs.jobsgo_pages || '1' }} pages)
            🔹 LinkedIn: ${{ steps.run_crawler.outputs.linkedin }} jobs (${{ inputs.linkedin_pages || '1' }} pages)
            🔹 VietnamWorks: ${{ steps.run_crawler.outputs.vietnamworks }} jobs (${{ inputs.vietnamworks_pages || '1' }} pages)

            ✅ Status: ${{ job.status }}
