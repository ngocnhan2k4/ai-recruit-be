name: Crawl Jobs

on:
  schedule:
    - cron: "30 10 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode for existing jobs"
        required: false
        default: "skip"
        type: choice
        options:
          - skip
          - update
      itviec_pages:
        description: "ITViec pages to crawl"
        required: false
        default: "1"
        type: string
      linkedin_pages:
        description: "LinkedIn pages to crawl"
        required: false
        default: "1"
        type: string
      topcv_pages:
        description: "TopCV pages to crawl"
        required: false
        default: "1"
        type: string
      jobsgo_pages:
        description: "JobsGO pages to crawl"
        required: false
        default: "1"
        type: string
      vietnamworks_pages:
        description: "VietnamWorks pages to crawl"
        required: false
        default: "1"
        type: string

jobs:
  run-crawler-ubuntu:
    runs-on: ubuntu-latest
    outputs:
      total_inserted: ${{ steps.aggregate_outputs.outputs.total_inserted }}
      total_updated: ${{ steps.aggregate_outputs.outputs.total_updated }}
      crawl_time: ${{ steps.aggregate_outputs.outputs.crawl_time }}
      itviec: ${{ steps.aggregate_outputs.outputs.itviec }}
      topcv: ${{ steps.aggregate_outputs.outputs.topcv }}
      jobsgo: ${{ steps.aggregate_outputs.outputs.jobsgo }}
      linkedin: ${{ steps.aggregate_outputs.outputs.linkedin }}
      vietnamworks: ${{ steps.aggregate_outputs.outputs.vietnamworks }}
      total_queue_enqueued: ${{ steps.aggregate_outputs.outputs.total_queue_enqueued }}
      total_queue_failed: ${{ steps.aggregate_outputs.outputs.total_queue_failed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: crawl_jobs/job_index_queue/package-lock.json

      - name: Install dependencies
        working-directory: ./crawl_jobs
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install queue bridge dependencies
        working-directory: ./crawl_jobs
        env:
          QUEUE_REDIS_URL_DEV: ${{ secrets.DEV_REDIS_URL }}
          QUEUE_REDIS_URL_PROD: ${{ secrets.PROD_REDIS_URL }}
        run: |
          if [ -n "$QUEUE_REDIS_URL_DEV" ] || [ -n "$QUEUE_REDIS_URL_PROD" ]; then
            npm ci --omit=dev --prefix ./job_index_queue
          else
            echo "Skip queue bridge install: REDIS_URL secrets are empty."
          fi

      - name: Run Crawler
        id: aggregate_outputs
        working-directory: ./crawl_jobs
        run: |
          python scripts/run_crawler.py \
            --platform ubuntu \
            --db-urls "${{ secrets.DEV_DATABASE_URL }}" "${{ secrets.PROD_DATABASE_URL }}" \
            --queue-redis-urls "${{ secrets.DEV_REDIS_URL }}" "${{ secrets.PROD_REDIS_URL }}" \
            --mode "${{ inputs.mode || 'update' }}" \
            --itviec-pages "${{ inputs.itviec_pages || '1' }}" \
            --vietnamworks-pages "${{ inputs.vietnamworks_pages || '1' }}"

      - name: Notify Slack
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.CRAWL_CHANNEL }}
          SLACK_CHANNEL: crawl
          SLACK_COLOR: ${{ job.status == 'success' && 'good' || 'danger' }}
          SLACK_TITLE: "📊 Kết quả crawl việc làm UBUNTU (Dev & Prod) - Mode: ${{ inputs.mode || 'update' }}"
          SLACK_MESSAGE: |
            🕒 Thời gian: ${{ steps.aggregate_outputs.outputs.crawl_time }}

            📈 Tổng hợp:
            ✓ Inserted: ${{ steps.aggregate_outputs.outputs.total_inserted }} jobs
            ↻ Updated: ${{ steps.aggregate_outputs.outputs.total_updated }} jobs

            🔹 ITviec: ${{ steps.aggregate_outputs.outputs.itviec }} jobs (${{ inputs.itviec_pages || '1' }} pages)
            🔹 LinkedIn (Ubuntu): ${{ steps.aggregate_outputs.outputs.linkedin }} jobs (10 jobs / 2 categories)
            🔹 VietnamWorks: ${{ steps.aggregate_outputs.outputs.vietnamworks }} jobs (${{ inputs.vietnamworks_pages || '1' }} pages)

            ✅ Status: ${{ job.status }}

  run-crawler-selfhosted:
    runs-on: self-hosted
    outputs:
      total_inserted: ${{ steps.aggregate_outputs.outputs.total_inserted }}
      total_updated: ${{ steps.aggregate_outputs.outputs.total_updated }}
      crawl_time: ${{ steps.aggregate_outputs.outputs.crawl_time }}
      itviec: ${{ steps.aggregate_outputs.outputs.itviec }}
      topcv: ${{ steps.aggregate_outputs.outputs.topcv }}
      jobsgo: ${{ steps.aggregate_outputs.outputs.jobsgo }}
      linkedin: ${{ steps.aggregate_outputs.outputs.linkedin }}
      vietnamworks: ${{ steps.aggregate_outputs.outputs.vietnamworks }}
      total_queue_enqueued: ${{ steps.aggregate_outputs.outputs.total_queue_enqueued }}
      total_queue_failed: ${{ steps.aggregate_outputs.outputs.total_queue_failed }}

    env:
      QUEUE_REDIS_URL_DEV: ${{ secrets.DEV_REDIS_URL }}
      QUEUE_REDIS_URL_PROD: ${{ secrets.PROD_REDIS_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Clean stale output files
        run: rm -f gha_out_*.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Node dependencies
        run: |
          npm ci --cache /home/cloud-user/.npm --prefer-offline
        working-directory: crawl_jobs/job_index_queue

      - name: Install dependencies
        working-directory: ./crawl_jobs
        run: |
          python -m pip install --upgrade pip --cache-dir /home/cloud-user/.cache/pip
          pip install -r requirements.txt --cache-dir /home/cloud-user/.cache/pip

      - name: Install queue bridge dependencies
        working-directory: ./crawl_jobs
        run: |
          if [ -n "$QUEUE_REDIS_URL_DEV" ] || [ -n "$QUEUE_REDIS_URL_PROD" ]; then
            npm ci --omit=dev --prefix ./job_index_queue --cache /home/cloud-user/.npm --prefer-offline
          else
            echo "Skip queue bridge install: REDIS_URL secrets are empty."
          fi

      - name: Run Crawler
        id: aggregate_outputs
        working-directory: ./crawl_jobs
        run: |
          python scripts/run_crawler.py \
            --platform selfhosted \
            --db-urls "${{ secrets.DEV_DATABASE_URL }}" "${{ secrets.PROD_DATABASE_URL }}" \
            --queue-redis-urls "${{ secrets.DEV_REDIS_URL }}" "${{ secrets.PROD_REDIS_URL }}" \
            --mode "${{ inputs.mode || 'update' }}" \
            --topcv-pages "${{ inputs.topcv_pages || '1' }}" \
            --jobsgo-pages "${{ inputs.jobsgo_pages || '1' }}"

      - name: Notify Slack
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.CRAWL_CHANNEL }}
          SLACK_CHANNEL: crawl
          SLACK_COLOR: ${{ job.status == 'success' && 'good' || 'danger' }}
          SLACK_TITLE: "📊 Kết quả crawl việc làm SELFHOSTED (Dev & Prod) - Mode: ${{ inputs.mode || 'update' }}"
          SLACK_MESSAGE: |
            🕒 Thời gian: ${{ steps.aggregate_outputs.outputs.crawl_time }}

            📈 Tổng hợp:
            ✓ Inserted: ${{ steps.aggregate_outputs.outputs.total_inserted }} jobs
            ↻ Updated: ${{ steps.aggregate_outputs.outputs.total_updated }} jobs

            🔹 TopCV: ${{ steps.aggregate_outputs.outputs.topcv }} jobs (${{ inputs.topcv_pages || '1' }} pages)
            🔹 JobsGo: ${{ steps.aggregate_outputs.outputs.jobsgo }} jobs (${{ inputs.jobsgo_pages || '1' }} pages)
            🔹 LinkedIn (Self-hosted): ${{ steps.aggregate_outputs.outputs.linkedin }} jobs (10 jobs / 2 categories)

            ✅ Status: ${{ job.status }}

  extract-skills:
    needs: [run-crawler-ubuntu, run-crawler-selfhosted]
    if: |
      always() &&
      (needs.run-crawler-ubuntu.result == 'success' || needs.run-crawler-selfhosted.result == 'success') &&
      (needs.run-crawler-ubuntu.outputs.total_inserted != '0' || needs.run-crawler-ubuntu.outputs.total_updated != '0' || 
       needs.run-crawler-selfhosted.outputs.total_inserted != '0' || needs.run-crawler-selfhosted.outputs.total_updated != '0')
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: ./crawl_jobs
        run: |
          python -m pip install --upgrade pip --cache-dir /home/cloud-user/.cache/pip
          pip install psycopg2-binary pandas transformers torch bs4 tqdm --cache-dir /home/cloud-user/.cache/pip

      - name: Export and Extract Skills
        working-directory: ./crawl_jobs
        env:
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: |
          python scripts/run_extract_skills.py

      - name: Cleanup HuggingFace cache
        if: always()
        run: |
          rm -rf ~/.cache/huggingface || true
          rm -rf ~/.cache/pip || true

      - name: Notify Slack
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.CRAWL_CHANNEL }}
          SLACK_CHANNEL: crawl
          SLACK_COLOR: ${{ job.status == 'success' && 'good' || 'danger' }}
          SLACK_TITLE: "🧠 Skill Extraction Results (Dev & Prod)"
          SLACK_MESSAGE: |
            📊 Dev jobs processed: ${{ env.DEV_JOB_COUNT || '0' }}
            📊 Prod jobs processed: ${{ env.PROD_JOB_COUNT || '0' }}
            ✅ Status: ${{ job.status }}
