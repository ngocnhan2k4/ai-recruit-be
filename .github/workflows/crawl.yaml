name: Crawl Jobs

on:
  schedule:
    - cron: "30 10 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode for existing jobs"
        required: false
        default: "skip"
        type: choice
        options:
          - skip
          - update
      itviec_pages:
        description: "ITViec pages to crawl"
        required: false
        default: "1"
        type: string
      linkedin_pages:
        description: "LinkedIn pages to crawl"
        required: false
        default: "1"
        type: string
      topcv_pages:
        description: "TopCV pages to crawl"
        required: false
        default: "1"
        type: string
      jobsgo_pages:
        description: "JobsGO pages to crawl"
        required: false
        default: "1"
        type: string
      vietnamworks_pages:
        description: "VietnamWorks pages to crawl"
        required: false
        default: "1"
        type: string

jobs:
  run-crawler-ubuntu:
    runs-on: ubuntu-latest
    outputs:
      total_inserted: ${{ steps.aggregate_outputs.outputs.total_inserted }}
      total_updated: ${{ steps.aggregate_outputs.outputs.total_updated }}
      crawl_time: ${{ steps.aggregate_outputs.outputs.crawl_time }}
      itviec: ${{ steps.aggregate_outputs.outputs.itviec }}
      topcv: ${{ steps.aggregate_outputs.outputs.topcv }}
      jobsgo: ${{ steps.aggregate_outputs.outputs.jobsgo }}
      linkedin: ${{ steps.aggregate_outputs.outputs.linkedin }}
      vietnamworks: ${{ steps.aggregate_outputs.outputs.vietnamworks }}
      total_queue_enqueued: ${{ steps.aggregate_outputs.outputs.total_queue_enqueued }}
      total_queue_failed: ${{ steps.aggregate_outputs.outputs.total_queue_failed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select LinkedIn keywords
        id: keywords
        shell: bash
        run: |
          python -c "
          import random, os
          lines = [line.strip() for line in open('crawl_jobs/classifier/data/categories.txt', encoding='utf-8') if line.strip()]
          kws = random.sample(lines, 2) if len(lines) >= 2 else (lines * 2)[:2]
          print(f'Selected Keywords: {kws}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'kw1={kws[0]}\n')
              f.write(f'kw2={kws[1]}\n')
          "

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: crawl_jobs/job_index_queue/package-lock.json

      - name: Install dependencies
        working-directory: ./crawl_jobs
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install queue bridge dependencies
        working-directory: ./crawl_jobs
        env:
          QUEUE_REDIS_URL_DEV: ${{ secrets.DEV_REDIS_URL }}
          QUEUE_REDIS_URL_PROD: ${{ secrets.PROD_REDIS_URL }}
        run: |
          if [ -n "$QUEUE_REDIS_URL_DEV" ] || [ -n "$QUEUE_REDIS_URL_PROD" ]; then
            npm ci --omit=dev --prefix ./job_index_queue
          else
            echo "Skip queue bridge install: REDIS_URL secrets are empty."
          fi

      - name: Prepare Redis URLs
        working-directory: ./crawl_jobs
        env:
          QUEUE_REDIS_URL_DEV: ${{ secrets.DEV_REDIS_URL }}
          QUEUE_REDIS_URL_PROD: ${{ secrets.PROD_REDIS_URL }}
        run: |
          echo "QUEUE_REDIS_URL_DEV=$QUEUE_REDIS_URL_DEV" >> "$GITHUB_ENV"
          echo "QUEUE_REDIS_URL_PROD=$QUEUE_REDIS_URL_PROD" >> "$GITHUB_ENV"

          echo "QUEUE_REDIS_URL_EFFECTIVE=$QUEUE_REDIS_URL" >> "$GITHUB_ENV"

          node <<'NODE'
          const path = require("path");
          const Redis = require(
            path.resolve(process.cwd(), "job_index_queue", "node_modules", "ioredis")
          );

          const url = process.env.QUEUE_REDIS_URL;
          const client = new Redis(url, {
            enableReadyCheck: true,
            connectTimeout: 5000,
            maxRetriesPerRequest: 1,
            retryStrategy: () => null,
          });

          const timer = setTimeout(() => {
            console.error("Redis connection timeout");
            process.exit(1);
          }, 6000);

          client.once("ready", async () => {
            clearTimeout(timer);
            await client.quit();
            process.exit(0);
          });

          client.once("error", (err) => {
            console.error(err?.message || err);
            process.exit(1);
          });
          NODE

          if [ $? -ne 0 ]; then
            echo "Queue disabled: Redis auth/connect failed."
            echo "QUEUE_REDIS_URL_EFFECTIVE=" >> "$GITHUB_ENV"
          fi

      - name: Run crawler - Part 1 (ITViec, VietnamWorks, LinkedIn KW1)
        id: run_crawler_1
        working-directory: ./crawl_jobs
        run: |
          QUEUE_ARGS=()
          if [ -n "$QUEUE_REDIS_URL_DEV" ] || [ -n "$QUEUE_REDIS_URL_PROD" ]; then
            QUEUE_ARGS+=(--queue-index-enabled --queue-redis-urls)
            [ -n "$QUEUE_REDIS_URL_DEV" ] && QUEUE_ARGS+=("$QUEUE_REDIS_URL_DEV")
            [ -n "$QUEUE_REDIS_URL_PROD" ] && QUEUE_ARGS+=("$QUEUE_REDIS_URL_PROD")
          fi

          python main.py \
            --db-urls "${{ secrets.DEV_DATABASE_URL }}" "${{ secrets.PROD_DATABASE_URL }}" \
            --gha-output "../gha_out_1.txt" \
            --mode ${{ inputs.mode || 'update' }} \
            --itviec-pages ${{ inputs.itviec_pages || '1' }} \
            --vietnamworks-pages ${{ inputs.vietnamworks_pages || '1' }} \
            --topcv-pages 0 \
            --jobsgo-pages 0 \
            --linkedin-pages 1 \
            --linkedin-keywords "${{ steps.keywords.outputs.kw1 }}" \
            --linkedin-limit 5 \
            "${QUEUE_ARGS[@]}"

      - name: Run crawler - Part 2 (LinkedIn KW2 only)
        id: run_crawler_2
        working-directory: ./crawl_jobs
        run: |
          QUEUE_ARGS=()
          if [ -n "$QUEUE_REDIS_URL_DEV" ] || [ -n "$QUEUE_REDIS_URL_PROD" ]; then
            QUEUE_ARGS+=(--queue-index-enabled --queue-redis-urls)
            [ -n "$QUEUE_REDIS_URL_DEV" ] && QUEUE_ARGS+=("$QUEUE_REDIS_URL_DEV")
            [ -n "$QUEUE_REDIS_URL_PROD" ] && QUEUE_ARGS+=("$QUEUE_REDIS_URL_PROD")
          fi

          python main.py \
            --db-urls "${{ secrets.DEV_DATABASE_URL }}" "${{ secrets.PROD_DATABASE_URL }}" \
            --gha-output "../gha_out_2.txt" \
            --mode ${{ inputs.mode || 'update' }} \
            --itviec-pages 0 \
            --vietnamworks-pages 0 \
            --topcv-pages 0 \
            --jobsgo-pages 0 \
            --linkedin-pages 1 \
            --linkedin-keywords "${{ steps.keywords.outputs.kw2 }}" \
            --linkedin-limit 5 \
            "${QUEUE_ARGS[@]}"

      - name: Aggregate Outputs
        id: aggregate_outputs
        run: |
          python -c "
          import os
          def load_vars(path):
              d = {}
              if os.path.exists(path):
                  for line in open(path):
                      if '=' in line:
                          k, v = line.strip().split('=', 1)
                          try: d[k] = int(v)
                          except: d[k] = v
              return d

          v1 = load_vars('gha_out_1.txt')
          v2 = load_vars('gha_out_2.txt')
          keys = set(v1.keys()) | set(v2.keys())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              for k in keys:
                  val1 = v1.get(k, 0)
                  val2 = v2.get(k, 0)
                  if isinstance(val1, int) and isinstance(val2, int):
                      f.write(f'{k}={val1 + val2}\n')
                  else:
                      f.write(f'{k}={val1 or val2}\n')
          "

      - name: Notify Slack
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.CRAWL_CHANNEL }}
          SLACK_CHANNEL: crawl
          SLACK_COLOR: ${{ job.status == 'success' && 'good' || 'danger' }}
          SLACK_TITLE: "📊 Kết quả crawl việc làm UBUNTU (Dev & Prod) - Mode: ${{ inputs.mode || 'update' }}"
          SLACK_MESSAGE: |
            🕒 Thời gian: ${{ steps.aggregate_outputs.outputs.crawl_time }}

            📈 Tổng hợp:
            ✓ Inserted: ${{ steps.aggregate_outputs.outputs.total_inserted }} jobs
            ↻ Updated: ${{ steps.aggregate_outputs.outputs.total_updated }} jobs

            🔹 ITviec: ${{ steps.aggregate_outputs.outputs.itviec }} jobs (${{ inputs.itviec_pages || '1' }} pages)
            🔹 LinkedIn (Ubuntu): ${{ steps.aggregate_outputs.outputs.linkedin }} jobs (10 jobs / 2 categories)
            🔹 VietnamWorks: ${{ steps.aggregate_outputs.outputs.vietnamworks }} jobs (${{ inputs.vietnamworks_pages || '1' }} pages)

            ✅ Status: ${{ job.status }}

  run-crawler-selfhosted:
    runs-on: self-hosted
    outputs:
      total_inserted: ${{ steps.aggregate_outputs.outputs.total_inserted }}
      total_updated: ${{ steps.aggregate_outputs.outputs.total_updated }}
      crawl_time: ${{ steps.aggregate_outputs.outputs.crawl_time }}
      itviec: ${{ steps.aggregate_outputs.outputs.itviec }}
      topcv: ${{ steps.aggregate_outputs.outputs.topcv }}
      jobsgo: ${{ steps.aggregate_outputs.outputs.jobsgo }}
      linkedin: ${{ steps.aggregate_outputs.outputs.linkedin }}
      vietnamworks: ${{ steps.aggregate_outputs.outputs.vietnamworks }}
      total_queue_enqueued: ${{ steps.aggregate_outputs.outputs.total_queue_enqueued }}
      total_queue_failed: ${{ steps.aggregate_outputs.outputs.total_queue_failed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select LinkedIn keywords
        id: keywords
        shell: bash
        run: |
          python -c "
          import random, os
          lines = [line.strip() for line in open('crawl_jobs/classifier/data/categories.txt', encoding='utf-8') if line.strip()]
          kws = random.sample(lines, 2) if len(lines) >= 2 else (lines * 2)[:2]
          print(f'Selected Keywords: {kws}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'kw1={kws[0]}\n')
              f.write(f'kw2={kws[1]}\n')
          "

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: crawl_jobs/job_index_queue/package-lock.json

      - name: Install dependencies
        working-directory: ./crawl_jobs
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install queue bridge dependencies
        working-directory: ./crawl_jobs
        env:
          QUEUE_REDIS_URL_DEV: ${{ secrets.DEV_REDIS_URL }}
          QUEUE_REDIS_URL_PROD: ${{ secrets.PROD_REDIS_URL }}
        run: |
          if [ -n "$QUEUE_REDIS_URL_DEV" ] || [ -n "$QUEUE_REDIS_URL_PROD" ]; then
            npm ci --omit=dev --prefix ./job_index_queue
          else
            echo "Skip queue bridge install: REDIS_URL secrets are empty."
          fi

      - name: Prepare Redis URLs
        working-directory: ./crawl_jobs
        env:
          QUEUE_REDIS_URL_DEV: ${{ secrets.DEV_REDIS_URL }}
          QUEUE_REDIS_URL_PROD: ${{ secrets.PROD_REDIS_URL }}
        run: |
          echo "QUEUE_REDIS_URL_DEV=$QUEUE_REDIS_URL_DEV" >> "$GITHUB_ENV"
          echo "QUEUE_REDIS_URL_PROD=$QUEUE_REDIS_URL_PROD" >> "$GITHUB_ENV"

          echo "QUEUE_REDIS_URL_EFFECTIVE=$QUEUE_REDIS_URL" >> "$GITHUB_ENV"

          node <<'NODE'
          const path = require("path");
          const Redis = require(
            path.resolve(process.cwd(), "job_index_queue", "node_modules", "ioredis")
          );

          const url = process.env.QUEUE_REDIS_URL;
          const client = new Redis(url, {
            enableReadyCheck: true,
            connectTimeout: 5000,
            maxRetriesPerRequest: 1,
            retryStrategy: () => null,
          });

          const timer = setTimeout(() => {
            console.error("Redis connection timeout");
            process.exit(1);
          }, 6000);

          client.once("ready", async () => {
            clearTimeout(timer);
            await client.quit();
            process.exit(0);
          });

          client.once("error", (err) => {
            console.error(err?.message || err);
            process.exit(1);
          });
          NODE

          if [ $? -ne 0 ]; then
            echo "Queue disabled: Redis auth/connect failed."
            echo "QUEUE_REDIS_URL_EFFECTIVE=" >> "$GITHUB_ENV"
          fi

      - name: Run crawler - Part 1 (TopCV, JobsGO, LinkedIn KW1)
        id: run_crawler_1
        working-directory: ./crawl_jobs
        run: |
          QUEUE_ARGS=()
          if [ -n "$QUEUE_REDIS_URL_DEV" ] || [ -n "$QUEUE_REDIS_URL_PROD" ]; then
            QUEUE_ARGS+=(--queue-index-enabled --queue-redis-urls)
            [ -n "$QUEUE_REDIS_URL_DEV" ] && QUEUE_ARGS+=("$QUEUE_REDIS_URL_DEV")
            [ -n "$QUEUE_REDIS_URL_PROD" ] && QUEUE_ARGS+=("$QUEUE_REDIS_URL_PROD")
          fi

          python main.py \
            --db-urls "${{ secrets.DEV_DATABASE_URL }}" "${{ secrets.PROD_DATABASE_URL }}" \
            --gha-output "../gha_out_1.txt" \
            --mode ${{ inputs.mode || 'update' }} \
            --itviec-pages 0 \
            --vietnamworks-pages 0 \
            --topcv-pages ${{ inputs.topcv_pages || '1' }} \
            --jobsgo-pages ${{ inputs.jobsgo_pages || '1' }} \
            --linkedin-pages 1 \
            --linkedin-keywords "${{ steps.keywords.outputs.kw1 }}" \
            --linkedin-limit 5 \
            "${QUEUE_ARGS[@]}"

      - name: Run crawler - Part 2 (LinkedIn KW2 only)
        id: run_crawler_2
        working-directory: ./crawl_jobs
        run: |
          QUEUE_ARGS=()
          if [ -n "$QUEUE_REDIS_URL_DEV" ] || [ -n "$QUEUE_REDIS_URL_PROD" ]; then
