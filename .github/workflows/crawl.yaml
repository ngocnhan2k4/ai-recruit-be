name: Classify Uncategorized Jobs

on:
  schedule:
    - cron: "0 2 * * 1,4"
  workflow_dispatch:

jobs:
  classify-jobs:
    strategy:
      matrix:
        env: [dev, prod]
      max-parallel: 1
    environment: ${{ matrix.env }}
    runs-on: arc-runner-set

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: crawl_jobs/job_index_queue/package-lock.json

      - name: Install dependencies
        working-directory: ./crawl_jobs
        run: |
          python -m pip install --upgrade pip

          pip install \
            psycopg2-binary \
            pandas \
            transformers \
            torch \
            --no-cache-dir

      - name: Install queue bridge dependencies
        working-directory: ./crawl_jobs
        env:
          QUEUE_REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          if [ -n "$QUEUE_REDIS_URL" ]; then
            npm ci --omit=dev --prefix ./job_index_queue
          else
            echo "Skip queue bridge install: REDIS_URL secret is empty."
          fi

      - name: Validate Redis credentials
        if: ${{ secrets.REDIS_URL != '' }}
        working-directory: ./crawl_jobs
        env:
          QUEUE_REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          echo "QUEUE_REDIS_URL_EFFECTIVE=$QUEUE_REDIS_URL" >> "$GITHUB_ENV"

          node <<'NODE'
          const Redis = require("ioredis");

          const url = process.env.QUEUE_REDIS_URL;
          const client = new Redis(url, {
            enableReadyCheck: true,
            connectTimeout: 5000,
            maxRetriesPerRequest: 1,
            retryStrategy: () => null,
          });

          const timer = setTimeout(() => {
            console.error("Redis connection timeout");
            process.exit(1);
          }, 6000);

          client.once("ready", async () => {
            clearTimeout(timer);
            await client.quit();
            process.exit(0);
          });

          client.once("error", (err) => {
            console.error(err?.message || err);
            process.exit(1);
          });
          NODE

          if [ $? -ne 0 ]; then
            echo "Queue disabled: Redis auth/connect failed."
            echo "QUEUE_REDIS_URL_EFFECTIVE=" >> "$GITHUB_ENV"
          fi

      - name: Export uncategorized jobs to CSV
        working-directory: ./crawl_jobs
        run: |
          mkdir -p classifier/data

          python scripts/export_uncategorized_jobs.py \
            --db_url "${{ secrets.DATABASE_URL }}" \
            --output_file "classifier/data/predict_jobs.csv"

      - name: Check if there are jobs to classify
        id: check_jobs
        working-directory: ./crawl_jobs
        shell: bash
        run: |
          if [ ! -f classifier/data/predict_jobs.csv ]; then
            echo "job_count=0" >> $GITHUB_OUTPUT
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          LINES=$(wc -l < classifier/data/predict_jobs.csv)

          JOB_COUNT=$((LINES - 1))

          echo "job_count=$JOB_COUNT" >> $GITHUB_OUTPUT

          if [ "$JOB_COUNT" -le 0 ]; then
            echo "📭 No uncategorized jobs found"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "📋 Found $JOB_COUNT jobs"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Run job classifier
        if: steps.check_jobs.outputs.skip != 'true'
        id: classifier
        working-directory: ./crawl_jobs
        shell: bash
        env:
          QUEUE_REDIS_URL: ${{ env.QUEUE_REDIS_URL_EFFECTIVE }}
        run: |
          EXTRA_ARGS=""

          if [ -n "$QUEUE_REDIS_URL" ]; then
            EXTRA_ARGS="--queue-index-enabled --queue-redis-url $QUEUE_REDIS_URL"
            echo "Queue indexing enabled"
          else
            echo "Queue indexing disabled"
          fi

          python -u main.py \
            --db-url "${{ secrets.DATABASE_URL }}" \
            --gha-output "$GITHUB_OUTPUT" \
            --mode update \
            $EXTRA_ARGS

      - name: Cleanup HuggingFace cache
        if: always()
        run: |
          rm -rf ~/.cache/huggingface || true
          rm -rf ~/.cache/pip || true

      - name: Notify Slack
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.CRAWL_CHANNEL }}
          SLACK_CHANNEL: crawl
          SLACK_COLOR: ${{ job.status == 'success' && 'good' || 'danger' }}
          SLACK_TITLE: "🏷️ Job Classification Results (${{ matrix.env }})"
          SLACK_MESSAGE: |
            📊 Jobs processed: ${{ steps.check_jobs.outputs.job_count || '0' }}
            ✅ Status: ${{ job.status }}

  extract-skills:
    needs: classify-jobs
    strategy:
      matrix:
        env: [dev, prod]
    environment: ${{ matrix.env }}
    runs-on: arc-runner-set

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        working-directory: ./crawl_jobs
        run: |
          python -m pip install --upgrade pip

          pip install \
            psycopg2-binary \
            pandas \
            transformers \
            torch \
            bs4 \
            tqdm \
            --no-cache-dir

      - name: Export unextracted jobs
        id: export_jobs
        working-directory: ./crawl_jobs
        shell: bash
        run: |
          mkdir -p extract_skills/data

          python scripts/export_recent_jobs_for_extraction.py \
            --db-url "${{ secrets.DATABASE_URL }}" \
            --output-file "extract_skills/data/jobs_export.csv" \
            --hours 24

          if [ -f "extract_skills/data/jobs_export.csv" ]; then
            LINES=$(wc -l < extract_skills/data/jobs_export.csv)
            JOB_COUNT=$((LINES - 1))
          else
            JOB_COUNT=0
          fi

          echo "job_count=$JOB_COUNT" >> $GITHUB_OUTPUT

      - name: Extract skills using huggingface model
        working-directory: ./crawl_jobs
        run: |
          python extract_skills/extract_skills.py \
            --db-url "${{ secrets.DATABASE_URL }}" \
            --model-path "tienminhktvn/extract-skills-model" \
            --input-file "extract_skills/data/jobs_export.csv"

      - name: Cleanup HuggingFace cache
        if: always()
        run: |
          rm -rf ~/.cache/huggingface || true
          rm -rf ~/.cache/pip || true

      - name: Notify Slack
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.CRAWL_CHANNEL }}
          SLACK_CHANNEL: crawl
          SLACK_COLOR: ${{ job.status == 'success' && 'good' || 'danger' }}
          SLACK_TITLE: "🧠 Skill Extraction Results (${{ matrix.env }})"
          SLACK_MESSAGE: |
            📊 Jobs processed: ${{ steps.export_jobs.outputs.job_count || '0' }}
            ✅ Status: ${{ job.status }}
