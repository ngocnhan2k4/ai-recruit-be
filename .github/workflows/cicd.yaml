name: CI/CD Pipeline

on:
  pull_request:
    branches: ["dev", "main"]
  push:
    branches: ["dev", "main"]

jobs:
  ci:
    environment: dev
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run ESLint
        id: lint
        run: bun run lint
        continue-on-error: false

      - name: Run Build
        id: build
        run: bun run build
        continue-on-error: false

      - name: Notify Slack on Success
        if: success()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: cicd
          SLACK_COLOR: good
          SLACK_TITLE: "✅ CI Pipeline Success"
          SLACK_MESSAGE: "All checks passed on ARC Runner ✅"

      - name: Notify Slack on Failure
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: cicd
          SLACK_COLOR: danger
          SLACK_TITLE: "❌ CI Pipeline Failed"
          SLACK_MESSAGE: "Pipeline failed on ARC Runner ❌"

  cd:
    needs: ci
    if: github.event_name == 'push'
    runs-on: self-hosted
    environment: dev
    env:
      IMAGE_NAME: ghcr.io/ngocnhan2k4/ai-recruit-be
      IMAGE_TAG: ${{ github.ref_name == 'main' && 'latest' || 'dev' }}
      COMPOSE_FILE: ${{ github.ref_name == 'main' && 'docker-compose.yaml' || 'docker-compose-dev.yaml' }}
      DEPLOY_DIR: ${{ github.ref_name == 'main' && '/var/www/my-app-main/' || '/var/www/my-app/' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy docker-compose to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          port: ${{ secrets.DEV_SERVER_SSH_PORT }}
          source: "./${{ env.COMPOSE_FILE }}"
          target: "${{ env.DEPLOY_DIR }}"

      - name: Deploy to Server
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          port: ${{ secrets.DEV_SERVER_SSH_PORT }}
          script: |
            echo "${{ secrets.REGISTRY_GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            cd ${{ env.DEPLOY_DIR }}
            docker compose -f ${{ env.COMPOSE_FILE }} pull
            docker compose -f ${{ env.COMPOSE_FILE }} up -d

            docker logout ghcr.io

      - name: Notify Slack
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_COLOR: ${{ job.status == 'success' && 'good' || 'danger' }}
          SLACK_TITLE: "Deploy Status: ${{ job.status }}"
