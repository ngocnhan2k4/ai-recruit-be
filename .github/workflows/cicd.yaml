name: CI/CD Pipeline

on:
  pull_request:
    branches: ["dev", "main"]

jobs:
  CI-CD:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run ESLint
        id: lint
        run: bun run lint
        continue-on-error: false

      - name: Run Build
        id: build
        run: bun run build
        continue-on-error: false

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      
      - name: Login to Docker Hub
        if: github.event.pull_request.base.ref == 'dev' && success()
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        if: github.event.pull_request.base.ref == 'dev' && success()
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/ai-recruit:${{ github.sha }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/ai-recruit:${{ github.sha }}

      - name: Copy docker-compose to server
        if: github.event.pull_request.base.ref == 'dev' && success()
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          port: ${{ secrets.DEV_SERVER_SSH_PORT }}
          source: "./docker-compose-dev.yaml"
          target: "/var/www/my-app/"
    
      - name: Deploy to Development Server
        if: github.event.pull_request.base.ref == 'dev' && success()
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          port: ${{ secrets.DEV_SERVER_SSH_PORT }}
          script: |
            cd /var/www/my-app
            sed -i "s|tnnhan57/ai-recruit:.*|tnnhan57/ai-recruit:${{ github.sha }}|g" docker-compose-dev.yaml
            docker-compose -f docker-compose-dev.yaml down
            docker rmi -f $(docker images -aq)
            docker-compose -f docker-compose-dev.yaml up -d

      - name: Health Check After Deployment
        id: healthcheck
        if: github.event.pull_request.base.ref == 'dev' && success()
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          port: ${{ secrets.DEV_SERVER_SSH_PORT }}
          script: |
            echo "🔍 Waiting for application to start..."
            sleep 30
            
            echo "🏥 Running health check..."
            
            # Check if container is running
            if ! docker-compose -f /var/www/my-app/docker-compose-dev.yaml ps | grep "Up"; then
              echo "❌ Container is not running"
              docker-compose -f /var/www/my-app/docker-compose-dev.yaml logs backend
              exit 1
            fi
            
            # Health check with retries
            MAX_RETRIES=5
            RETRY_COUNT=0
            
            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              echo "🔄 Health check attempt $((RETRY_COUNT + 1))/$MAX_RETRIES"
              
              # Test simple health endpoint
              if curl -f -s http://localhost:3000/health > /dev/null 2>&1; then
                echo "✅ Health check passed!"
                
                # Get health check response
                HEALTH_RESPONSE=$(curl -s http://localhost:3000/health/simple)
                echo "📊 Health Status: $HEALTH_RESPONSE"
            
                exit 0
              else
                echo "❌ Health check failed (attempt $((RETRY_COUNT + 1)))"
                RETRY_COUNT=$((RETRY_COUNT + 1))
                
                if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                  echo "⏳ Waiting 15 seconds before retry..."
                  sleep 15
                fi
              fi
            done
            
            echo "❌ Health check failed after $MAX_RETRIES attempts"
            echo "📋 Container logs:"
            docker-compose -f /var/www/my-app/docker-compose-dev.yaml logs --tail=20 backend
            echo "🔍 Container status:"
            docker-compose -f /var/www/my-app/docker-compose-dev.yaml ps
            exit 1

      - name: Notify Slack on Success
        if: success()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: cicd
          SLACK_COLOR: good
          SLACK_TITLE: "✅ CI Pipeline Success"
          SLACK_MESSAGE: |
            *Repository:* ${{ github.repository }}
            *Branch:* ${{ github.ref_name }}
            *Commit:* ${{ github.event.head_commit.message }}
            *Author:* ${{ github.event.head_commit.author.name }}
            *Status:* All checks passed ✅
            
            **Checks Completed:**
            • ESLint: ✅ Passed
            • Build: ✅ Passed
            • SonarQube: ✅ Passed
            • Docker: ✅ Built & Pushed
            • Deploy: ✅ Successful

      - name: Notify Slack on Failure
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: cicd
          SLACK_COLOR: danger
          SLACK_TITLE: "❌ CI Pipeline Failed - Merge Blocked"
          SLACK_MESSAGE: |
            *Repository:* ${{ github.repository }}
            *Branch:* ${{ github.ref_name }}
            *Commit:* ${{ github.event.head_commit.message }}
            *Author:* ${{ github.event.head_commit.author.name }}
            *Status:* Pipeline failed ❌
            
            **Failed Checks:**
            ${{ steps.lint.outcome == 'failure' && '• ESLint: ❌ Failed' || '• ESLint: ✅ Passed' }}
            ${{ steps.build.outcome == 'failure' && '• Build: ❌ Failed' || '• Build: ✅ Passed' }}

            🚫 **Merge is blocked until all checks pass**
            
            Please fix the issues and push again.