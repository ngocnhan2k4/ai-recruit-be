name: CI/CD Pipeline

on:
  pull_request:
    branches: ["dev", "main"]

jobs:
  CI:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run ESLint
        id: lint
        run: bun run lint
        continue-on-error: false

      - name: Run Build
        id: build
        run: bun run build
        continue-on-error: false

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      
      - name: Login to Docker Hub
        if: github.event.pull_request.base.ref == 'dev' && success()
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        if: github.event.pull_request.base.ref == 'dev' && success()
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/ai-recruit:${{ github.sha }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/ai-recruit:${{ github.sha }}

      - name: Deploy to Development Server
        if: github.ref == 'refs/heads/dev' && success()
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          port: ${{ secrets.DEV_SERVER_SSH_PORT }}
          script: |
            cd /var/www/my-app
            export GITHUB_SHA=${{ github.sha }}
            scp $GITHUB_WORKSPACE/docker-compose-dev.yaml ${{ secrets.DEV_SERVER_USER }}@${{ secrets.DEV_SERVER_HOST }}:/var/www/my-app/docker-compose-dev.yaml 
            docker-compose -f docker-compose-dev.yaml pull
            docker-compose -f docker-compose-dev.yaml up -d


      - name: Notify Slack on Success
        if: success()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: cicd
          SLACK_COLOR: good
          SLACK_TITLE: "✅ CI Pipeline Success"
          SLACK_MESSAGE: |
            *Repository:* ${{ github.repository }}
            *Branch:* ${{ github.ref_name }}
            *Commit:* ${{ github.event.head_commit.message }}
            *Author:* ${{ github.event.head_commit.author.name }}
            *Status:* All checks passed ✅
            
            **Checks Completed:**
            • ESLint: ✅ Passed
            • Build: ✅ Passed
            • SonarQube: ✅ Passed
            • Docker: ✅ Built & Pushed
            • Deploy: ✅ Successful

      - name: Notify Slack on Failure
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: cicd
          SLACK_COLOR: danger
          SLACK_TITLE: "❌ CI Pipeline Failed - Merge Blocked"
          SLACK_MESSAGE: |
            *Repository:* ${{ github.repository }}
            *Branch:* ${{ github.ref_name }}
            *Commit:* ${{ github.event.head_commit.message }}
            *Author:* ${{ github.event.head_commit.author.name }}
            *Status:* Pipeline failed ❌
            
            **Failed Checks:**
            ${{ steps.lint.outcome == 'failure' && '• ESLint: ❌ Failed' || '• ESLint: ✅ Passed' }}
            ${{ steps.build.outcome == 'failure' && '• Build: ❌ Failed' || '• Build: ✅ Passed' }}

            🚫 **Merge is blocked until all checks pass**
            
            Please fix the issues and push again.